<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tarjeta de Presentación</title>

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#4facfe,#00f2fe);
    font-family:Arial, Helvetica, sans-serif;
}

.tarjeta{
    background:white;
    padding:30px 40px;
    border-radius:15px;
    box-shadow:0 10px 25px rgba(0,0,0,0.2);
    text-align:center;
    width:300px;
}

.tarjeta h1{
    margin:0;
    font-size:28px;
    color:#333;
}

.tarjeta p{
    margin:10px 0;
    color:#666;
}

.tarjeta .contacto{
    margin-top:20px;
    font-size:14px;
    color:#444;
}
</style>

</head>
<body>

<div class="tarjeta">
    <h1>Cristian</h1>
    <p>Desarrollador Web</p>
    <div class="contacto">
        📧 cristian@email.com <br>
        📱 +57 300 000 0000
    </div>
</div>

</body>
</html>

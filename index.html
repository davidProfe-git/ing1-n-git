<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mi Tarjeta de Presentación</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            /* Fondo de toda la página verde manzana */
            background-color: #8db600; 
        }
        
        .card { 
            /* Fondo de la tarjeta también verde manzana */
            background-color: #8db600; 
            padding: 2rem; 
            border-radius: 15px; 
            /* Sombra un poco más oscura para que la tarjeta se note sobre el fondo */
            box-shadow: 20px 20px 60px #789b00, -20px -20px 60px #a2d100;
            text-align: center; 
        }

        h1 { 
            color: #333; 
            margin-bottom: 0.5rem; 
            font-weight: bold; 
        }

        p { 
            color: #444; 
            font-size: 1.1rem; 
            font-weight: bold; 
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Hola, soy María</h1>
        <p>Estudiante de Ingeniería de Software</p>
    </div>
</body>
</html>

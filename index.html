<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Tarjeta de Presentación</title>

<style>
body{
    background:#f4f4f4;
    font-family: Arial, sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.card{
    width:320px;
    background:white;
    border-radius:12px;
    padding:20px;
    text-align:center;
    box-shadow:0 4px 10px rgba(0,0,0,0.2);
}

.card img{
    width:90px;
    border-radius:50%;
}

.card h2{
    margin:10px 0 5px;
}

.card p{
    color:#555;
    margin:5px 0;
}

.contact{
    margin-top:15px;
    font-size:14px;
}
</style>
</head>

<body>

<div class="card">
    <img src="https://via.placeholder.com/90" alt="Foto">

    <h2>Natalia Barrera Munevar</h2>
    <p>Desarrolladora </p>

    <div class="contact">
        <p>📞 +57 300 123 4567</p>
        <p>✉ nataliabm.com</p>
        <p>📍 Bogotá, Colombia</p>
    </div>
</div>

</body>
</html>

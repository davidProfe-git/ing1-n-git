<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarjeta de Presentación</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f9;
        }
        .card {
            background: #ffffff;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            padding: 20px;
            text-align: center;
            max-width: 350px;
            width: 100%;
        }
        .card img {
            width: 100%;
            height: auto;
            border-radius: 10px;
            margin-bottom: 15px;
        }
        .card h1 {
            font-size: 1.5em;
            margin: 0;
            color: #333333;
        }
        .card p {
            font-size: 1em;
            color: #666666;
            margin: 10px 0 0;
        }
    </style>
</head>
<body>
    <div class="card">
        <img src="https://www.radioacktiva.com/wp-content/uploads/2019/04/toreto-436x291.jpg" alt="Foto de David Rugeles">
        <h1>David Rugeles</h1>
        <p>Pedagogo Re Educativo</p>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mi Tarjeta de Presentación</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #f4f4f9; }
        
        .card { 
            /* Ahora el fondo es verde manzana */
            background-color: #8db600; 
            padding: 2rem; 
            border-radius: 15px; 
            box-shadow: 0 10px 20px rgba(0,0,0,0.2); 
            text-align: center; 
            /* Quitamos el borde superior porque ya todo es verde */
        }

        h1 { 
            color: #ffffff; /* Letra blanca para que resalte en el verde */
            margin-bottom: 0.5rem; 
            font-weight: bold; 
        }

        p { 
            color: #ffffff; /* Letra blanca */
            font-size: 1.1rem; 
            font-weight: bold; 
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Hola, soy María</h1>
        <p>Estudiante de Ingeniería de Software</p>
    </div>
</body>

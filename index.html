<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mi Tarjeta de Presentación</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #f4f4f9; }
        .card { background: white; padding: 2rem; border-radius: 15px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); text-align: center; border-top: 5px solid #007bff; }
        h1 { color: #333; margin-bottom: 0.5rem; }
        p { color: #666; font-size: 1.1rem; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Hola, soy María</h1>
        <p>Estudiante de Ingeniería de Software</p>
    </div>
</body>
</html>

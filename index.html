<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tarjeta de Presentación</title>

<style>

body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family: Arial, Helvetica, sans-serif;

    /* Fondo azul cielo con degradado */
    background: linear-gradient(135deg,#87CEEB,#5dade2);
}

.card{

    background:white;
    padding:40px;
    width:320px;
    border-radius:20px;
    text-align:center;

    box-shadow:0 15px 40px rgba(0,0,0,0.2);

    transition: transform 0.3s, box-shadow 0.3s;
}

.card:hover{
    transform: translateY(-10px);
    box-shadow:0 25px 50px rgba(0,0,0,0.3);
}

.top-bar{
    width:100%;
    height:8px;
    background:#8db600;
    border-radius:10px 10px 0 0;
    margin-bottom:25px;
}

h1{
    margin:0;
    color:#2c3e50;
    font-size:28px;
}

p{
    color:#555;
    font-size:16px;
    margin-top:10px;
}

button{

    margin-top:25px;
    padding:10px 25px;
    border:none;
    border-radius:25px;
    background:#8db600;
    color:white;
    font-weight:bold;
    cursor:pointer;

    transition: background 0.3s;
}

button:hover{
    background:#6f8f00;
}

</style>
</head>

<body>

<div class="card">

<div class="top-bar"></div>

<h1>Hola, soy María</h1>

<p>Estudiante de Ingeniería de Software</p>

<button>Contáctame</button>

</div>

</body>

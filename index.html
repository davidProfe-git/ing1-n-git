<!doctype html>
<html lang="es">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width,initial-scale=1">
		<title>Tarjeta de presentación</title>
		<link rel="stylesheet" href="styles.css">
	</head>
	<body>
		<main class="center">
			<article class="card" aria-label="Tarjeta de presentación">
				<div class="card__inner">
					<div class="card__face card__front">
						<img class="avatar" src="profile.svg" alt="Foto de perfil">
						<h1 class="name">David Rugeles</h1>
						<p class="role">Estudiante de Ingeniería de Software</p>
						<p class="contact">david@example.com · +34 600 000 000</p>
					</div>
					<div class="card__face card__back">
						<h2 class="brand">David Rugeles</h2>
						<p class="back-line">Especialidad: Desarrollo web</p>
						<p class="back-line">GitHub: github.com/david</p>
						<p class="back-line">Portfolio: example.com</p>
					</div>
				</div>
			</article>
		</main>
	</body>
</html>
